name: Update YourTube feed

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit generated feed data and deploy Pages"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Collect only; do not write files, commit, or deploy"
        required: true
        type: boolean
        default: false
      no_details:
        description: "Skip yt-dlp rich metadata probes and reuse cache"
        required: true
        type: boolean
        default: false
      no_secondary:
        description: "Skip topic/keyword discovery for this run"
        required: true
        type: boolean
        default: false
      workers:
        description: "Channel worker count"
        required: true
        type: string
        default: "6"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: nexafeed-main-write
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.mode.outputs.should_deploy }}
      target_branch: ${{ steps.mode.outputs.target_branch }}
    env:
      NEXAFEED_DISABLE_HERMES_ENV: "1"
      NEXAFEED_LLM_PROVIDER: ${{ vars.NEXAFEED_LLM_PROVIDER }}
      NEXAFEED_LLM_MODEL: ${{ vars.NEXAFEED_LLM_MODEL }}
      NEXAFEED_LLM_BASE_URL: ${{ vars.NEXAFEED_LLM_BASE_URL }}
      NEXAFEED_SITE_URL: ${{ vars.NEXAFEED_SITE_URL }}
      NEXAFEED_SITE_NAME: ${{ vars.NEXAFEED_SITE_NAME }}
      NEXAFEED_TAGLINE: ${{ vars.NEXAFEED_TAGLINE }}
      NEXAFEED_REPOSITORY_URL: ${{ vars.NEXAFEED_REPOSITORY_URL }}
      NEXAFEED_TIMEZONE: ${{ vars.NEXAFEED_TIMEZONE }}
      NEXAFEED_BRANCH: ${{ vars.NEXAFEED_BRANCH || github.ref_name }}
      OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.NEXAFEED_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install collector dependency
        run: python -m pip install --upgrade yt-dlp

      - name: Check setup without printing secrets
        run: python3 scripts/nexafeed_doctor.py

      - name: Decide whether to deploy
        id: mode
        run: |
          if [[ "${{ inputs.publish }}" == "true" && "${{ inputs.dry_run }}" != "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "target_branch=$NEXAFEED_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Refresh feed
        env:
          WORKERS: ${{ inputs.workers }}
          PUBLISH: ${{ inputs.publish }}
          DRY_RUN: ${{ inputs.dry_run }}
          NO_DETAILS: ${{ inputs.no_details }}
          NO_SECONDARY: ${{ inputs.no_secondary }}
          NEXAFEED_LLM_API_KEY: ${{ secrets.NEXAFEED_LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set -euo pipefail
          args=(--pull-first --require-clean --workers "$WORKERS")
          if [[ "$PUBLISH" == "true" ]]; then args+=(--publish); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$NO_DETAILS" == "true" ]]; then args+=(--no-details); fi
          if [[ "$NO_SECONDARY" == "true" ]]; then args+=(--no-secondary); fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/nexafeed_automation.py "${args[@]}"

      - name: Verify feed and static app
        run: |
          python3 tests/test_nexafeed_features.py -v
          python3 scripts/verify_nexafeed.py

  deploy:
    needs: update
    if: ${{ needs.update.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: nexafeed-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.update.outputs.target_branch }}

      - name: Verify deployed feed artifact source
        run: python3 scripts/verify_nexafeed.py

      - name: Prepare updated static site
        run: |
          mkdir _site
          cp index.html style.css app.js short-history.mjs float.html config.json _site/
          cp -R data _site/data
          if [ -d docs ]; then cp -R docs _site/docs; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Deploy updated feed
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
